name: whats-erase

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-whats_erase}
      POSTGRES_USER: ${APP_DB_USER:-whats_erase}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?execute ./scripts/setup.sh}
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-whats_erase} -d ${APP_DB_NAME:-whats_erase}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app-data]
    logging: *default-logging

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?execute ./scripts/setup.sh}
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution} -d ${EVOLUTION_DB_NAME:-evolution}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [evolution-data]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [evolution-data]
    logging: *default-logging

  evolution:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:${EVOLUTION_PORT:-18080}
      # A API e chamada server-to-server sem header Origin. A porta continua
      # restrita ao loopback e as rotas sensiveis exigem apikey.
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      # Evita que eventos de mensagem aparecam nos logs brutos do container.
      # O painel mantem sua propria auditoria sanitizada dos eventos operacionais.
      LOG_LEVEL: ERROR,WARN
      LOG_COLOR: "false"
      LOG_BAILEYS: fatal
      TELEMETRY_ENABLED: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/${EVOLUTION_DB_NAME:-evolution}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: whats_erase
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      DATABASE_DELETE_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: whats-erase-evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?execute ./scripts/setup.sh}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/verify-creds',{method:'POST',headers:{apikey:process.env.AUTHENTICATION_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [evolution-data, control]
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      app-db:
        condition: service_healthy
      evolution:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${APP_DB_USER:-whats_erase}:${APP_DB_PASSWORD}@app-db:5432/${APP_DB_NAME:-whats_erase}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?execute ./scripts/setup.sh}
      SESSION_SECRET: ${SESSION_SECRET:?execute ./scripts/setup.sh}
      BUNDLED_EVOLUTION_URL: ${BUNDLED_EVOLUTION_URL:-http://evolution:8080}
      PUBLIC_EVOLUTION_URL: ${PUBLIC_EVOLUTION_URL:-http://localhost:18080}
      BUNDLED_EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?execute ./scripts/setup.sh}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://app:3000/api/webhooks/evolution}
    ports:
      - "127.0.0.1:${APP_PORT:-3210}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [app-data, control]
    logging: *default-logging

volumes:
  app_db_data:
  evolution_db_data:
  evolution_redis_data:
  evolution_instances:

networks:
  app-data:
    driver: bridge
    internal: true
  evolution-data:
    driver: bridge
    internal: true
  control:
    driver: bridge
